source: >-
  Derived from openapi/_original/picus-security-openapi.json (Swagger 2.0) and the Picus docs
  (authentication-method, request, response-codes-errors, rate-limit, versioning), plus the compliance
  attestations published on https://www.picussecurity.com/trust-center
summary: >-
  The Picus Customer API is a plain JSON REST API with bearer-token authorization. It does not implement
  RFC 9457 problem details, RFC 8594 sunset signalling, RFC 9116 security.txt, OIDC discovery, or any
  domain interop standard. Its strongest standards posture is on the security/compliance side (ISO 27001,
  ISO 27701, ISO 22301, ISO 20000-1, SOC 2 Type 2, CSA STAR Level One) and on threat-modelling vocabularies
  (MITRE ATT&CK and the Unified Kill Chain are first-class response structures).
standards:
- id: openapi
  conforms: false
  evidence: >-
    Contract is Swagger 2.0 (the document declares swagger 2.0, not openapi 3.x). Served at
    https://api.picussecurity.com/swagger.json
- id: swagger-2.0
  conforms: true
  evidence: openapi/_original/picus-security-openapi.json — 71 paths, 84 operations, 141 definitions, 83 shared responses
- id: rest-json
  conforms: true
  evidence: consumes/produces application/json across every operation; resource-oriented /v1 and /v2 paths
- id: oauth2
  conforms: false
  partial: true
  evidence: >-
    The docs describe the flow as "OAuth2 protocol is used to authorize Refresh/Access tokens", but the
    contract declares a single apiKey scheme (Access-Token in the Authorization header) and the exchange is a
    proprietary POST /v1/auth/token with a `refresh_token` JSON body — not an RFC 6749 token endpoint
    (no grant_type, no client credentials, no token_type/expires_in response). Treat as OAuth2-flavoured
    bearer tokens, not RFC 6749 conformance.
- id: oidc
  conforms: false
  evidence: No /.well-known/openid-configuration on any Picus host (see well-known/picus-security-well-known.yml)
- id: rfc8414-oauth-authorization-server-metadata
  conforms: false
  evidence: /.well-known/oauth-authorization-server returns 404 on api.picussecurity.com
- id: rfc6750-bearer-token
  conforms: true
  partial: true
  evidence: >-
    The Authorization header carries "Bearer {accessToken}" — the documented and declared credential presentation
- id: rfc9457-problem-details
  conforms: false
  evidence: Errors are application/json with proprietary envelopes; see errors/picus-security-problem-types.yml
- id: rfc7231-status-codes
  conforms: true
  evidence: >-
