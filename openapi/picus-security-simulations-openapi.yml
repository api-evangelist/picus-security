        type: boolean
    x-go-package: github.com/picusnext/picus-ng-lib/go/kit/types
  Pagination:
    type: object
    properties:
      limit:
        description: Limit
        type: integer
        format: int64
        x-go-name: Limit
        example: 20
      offset:
        description: Offset
        type: integer
        format: int64
        x-go-name: Offset
        example: 0
      total_count:
        description: Total Count
        type: integer
        format: int64
        x-go-name: TotalCount
        example: 100
    x-go-package: github.com/picusnext/picus-digital/go/customer-api/apirequest
  ScheduleInput:
    type: object
    required:
    - start_time
    - name
    - frequency
    properties:
      day_of_month:
        description: required if frequency is `MONTHLY`
        type: array
        maximum: 31
        minimum: 1
        items:
          type: integer
          format: int64
        x-go-name: DayOfMonth
        example:
        - 1
        - 30
      day_of_week:
        description: required if frequency is `WEEKLY`
        type: array
        maximum: 7
        minimum: 1
        items:
          type: integer
          format: int64
        x-go-name: DayOfWeek
        example:
        - 1
        - 3
      frequency:
        description: ONCE, DAILY, WEEKLY, MONTHLY
        type: string
        maximum: 10
        minimum: 4
        x-go-name: Frequency
        example: WEEKLY
      frequency_interval:
        description: required if frequency is not `ONCE`
        type: integer
        format: int64
        x-go-name: FrequencyInterval
        example: 2
      name:
        type: string
        maximum: 500
        minimum: 1
        x-go-name: Name
        example: Schedule-1
      start_time:
        description: 'time format -> `epoch`

          Optional value: `now`'
        type: integer
        format: int64
        x-go-name: StartTime
    x-go-package: github.com/picusnext/picus-digital/go/customer-api/internal_request/customer_api_dto
  SimulationApiOutput:
    type: object
    properties:
      agent_id:
        $ref: '#/definitions/NullInt64'
      agent_user_ids:
        description: agent user ids for installable agent execution users
        type: array
        items:
          type: integer
          format: uint64
        x-go-name: AgentUserIDs
        example:
        - 1
        - 2
      description:
        description: Simulation Description (description of the simulation)
        type: string
        x-go-name: Description
        example: description of the simulation
      id:
        description: Simulation Id (1)
        type: integer
        format: uint64
        x-go-name: ID
        example: 1
      integrations:
        description: Simulation Integrations ([1,2,3])
        type: array
        items:
          type: integer
          format: uint64
        x-go-name: Integrations
        example:
        - 1
        - 2
        - 3
      is_active:
        $ref: '#/definitions/NullBool'
      name:
        description: Simulation Name (Simulation - 1)
        type: string
        x-go-name: Name
        example: Simulation - 1
      obfuscation_methods:
        description: obfuscation methods
        type: array
        items:
          type: string
        x-go-name: ObfuscationMethods
      protocols:
        description: 'Simulation Protocols ([http, https])

          protocols'
        type: array
        items:
          $ref: '#/definitions/AssessmentProtocol'
        x-go-name: Protocols
      schedule_id:
        description: Simulation Schedule Id (3)
        type: integer
        format: uint64
        x-go-name: ScheduleID
        example: 3
      template_id:
        $ref: '#/definitions/NullInt64'
    x-go-package: github.com/picusnext/picus-digital/go/customer-api/internal_request/customer_api_dto
  SimulationDetailsReturn:
    type: object
    properties:
      agent:
        $ref: '#/definitions/AgentSummary'
      completion_ratio:
        type: integer
        format: int64
        x-go-name: CompletionRatio
