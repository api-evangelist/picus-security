swagger: '2.0'
info:
  title: Picus Customer API — Simulations
  description: '<p class="body-1">You can access the simulation raw data using the Rest API. Scope of the API includes; Simulation
    list, Simulation Details, Threat/Objective/Action Results, Results mapped to MITRE ATTC&K and Unified Kill Chain frameworks,
    Detection Analysis Results, Validated Logs & Alerts with SIEM & EDR integration.</p>

    <p class="body-1">OAuth2 protocol is used to authorize Refresh/Access tokens. To obtain the API, you should generate a
    refresh token and then request an access token using the /v1/auth/token endpoint. The refresh token will be valid for
    6 months, whereas the access token will be available for 2 hours. After getting the access token, add Authorization: Bearer
    {accessToken} to the header to request access to the below endpoints.</p>

    <p class="body-1">Endpoints returning data with a lot of load works with the pagination method. You can use the offset
    and limit parameters to get the correct page.</p>


    <i class="body-1">Your usage will be limited with your Picus license.</i>'
  version: '1.0'
host: api.picussecurity.com
basePath: /
schemes:
- https
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  Access-Token:
    description: After getting the access token, type <i>Bearer accessToken</i> to the Value input box to request access to
      the below endpoints For example <i>Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9</i>
    type: apiKey
    name: Authorization
    in: header
security:
- Access-Token: []
tags:
- name: Simulations
paths:
  /v1/simulations:
    get:
      security:
      - Access-Token: []
      description: 'Simulation List; Simulation ID, Simulation Name, Simulation Agent (with status), Enrichment Status, Last
        Prevention Result, Last Detection Result (if Available)

        Default limit: 25, Default offset: 0

        Max limit: 50'
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulations
      summary: '# Simulation List'
      operationId: simulationListParams
      parameters:
      - type: integer
        format: int64
        x-go-name: Limit
        name: limit
        in: query
      - type: integer
        format: int64
        x-go-name: Offset
        name: offset
        in: query
      - type: array
        items:
          type: string
        x-go-name: Status
        description: 'Filter with Status (one or more status): RUNNING | STOPPED | WAITING FOR THE FIRST RUN | NOT STARTED
          | COMPLETED'
        name: status
        in: query
      - type: string
        x-go-name: SimulationName
        description: Filter with Simulation name.
        name: simulation_name
        in: query
      - type: string
        x-go-name: AgentName
        description: Filter with Agent name.
        name: agent_name
        in: query
      - type: integer
        format: uint64
        x-go-name: AgentId
        description: Filter with Agent id.
        name: agent_id
        in: query
      - type: string
        x-go-name: TemplateName
        description: Filter with Template name.
        name: template_name
        in: query
      - type: integer
        format: uint64
        x-go-name: TemplateId
        description: Filter with Template id.
        name: template_id
        in: query
      - maximum: 100
        minimum: -1
        type: integer
        format: int64
        x-go-name: PreventionResultLte
        description: Filter with Prevention Result Less Than or Equals
        name: prevention_result_lte
        in: query
      - maximum: 100
        minimum: -1
        type: integer
        format: int64
        x-go-name: PreventionResultGte
        description: Filter with Prevention Result Greater Than or Equals
        name: prevention_result_gte
        in: query
      - maximum: 100
        minimum: -1
        type: integer
        format: int64
        x-go-name: DetectionResultLte
        description: Filter with Detection Result Less Than or Equals
        name: detection_result_lte
        in: query
      - maximum: 100
        minimum: -1
        type: integer
        format: int64
        x-go-name: DetectionResultGte
        description: Filter with Detection Result Greater Than or Equals
        name: detection_result_gte
        in: query
      responses:
        '200':
          $ref: '#/responses/SimulationsResponse'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorSwagger'
    post:
      security:
      - Access-Token: []
      description: Creates the simulation with given information
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulations
      summary: '# Create Simulation'
      operationId: createSimulationParams
      parameters:
      - name: Body
        in: body
        schema:
          type: object
          required:
          - name
          - template_id
          properties:
            agent_id:
              description: id of the agent
              type: integer
              format: uint64
              maximum: 1000000
              minimum: 1
              x-go-name: AgentID
              example: 3
            agent_user_ids:
              description: agent user ids for installable agent execution users
              type: array
              maxItems: 2
              items:
                type: integer
                format: uint64
              x-go-name: AgentUserIDs
              example:
              - 1
              - 2
            auto_resume:
              description: auto resume feature of the simulation, if set auto resume will be enabled for simulation
              type: boolean
              x-go-name: AutoResume
            description:
              description: description of the simulation
              type: string
              maximum: 1000
              x-go-name: Description
              example: This simulation rocks!
            force:
              description: 'force (option to create identical simulation)

                available values are true and false'
              type: boolean
              x-go-name: Force
            integrations:
              description: integration ids
              type: array
              items:
                type: integer
                format: uint64
              x-go-name: Integrations
              example:
              - 1
              - 2
              - 3
            name:
              description: name of the simulation
              type: string
              maximum: 500
              minimum: 1
              x-go-name: Name
              example: simulation - 1
            obfuscation_methods:
              description: 'TODO : add max

                obfuscation methods'
              type: array
              items:
                type: string
              x-go-name: ObfuscationMethods
              example: Base64 Encoding, XOR Encryption
            protocols:
              description: protocols
              type: array
              items:
                $ref: '#/definitions/SimulationProtocol'
              x-go-name: Protocols
            schedule:
              $ref: '#/definitions/ScheduleInput'
            schedule_now:
              type: boolean
              x-go-name: ScheduleNow
            template_id:
              description: id of the scope
              type: integer
              format: uint64
              maximum: 10000
              minimum: 1
              x-go-name: TemplateId
              example: 1
      responses:
        '200':
          $ref: '#/responses/SimulationCreateReturnSwagger'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorSwagger'
  /v1/simulations/{Id}:
    get:
      security:
      - Access-Token: []
      description: 'Simulation Detail; Simulation Name, Simulation Agent (with status), Enrichment Status, Last Prevention
        Result,

        Last Detection Result (if Available), Simulation Run List'
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulations
      summary: '# Simulation Detail'
      operationId: simulationParams
      parameters:
      - type: integer
        format: uint64
        description: Simulation ID (URI parameter)
        name: Id
        in: path
        required: true
      responses:
        '200':
          $ref: '#/responses/SimulationDetailReturnSwagger'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorSwagger'
    put:
      security:
      - Access-Token: []
      description: Updates the simulation with given information
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulations
      summary: '# Update Simulation'
      operationId: updateSimulationParams
      parameters:
      - type: integer
        format: uint64
        description: Simulation ID (URI parameter)
        name: Id
        in: path
        required: true
      - name: Body
        in: body
        schema:
          type: object
          properties:
            schedule:
              $ref: '#/definitions/ScheduleInput'
            schedule_now:
              type: boolean
              x-go-name: ScheduleNow
      responses:
        '200':
          $ref: '#/responses/SimulationUpdateReturnSwagger'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorSwagger'
    delete:
      security:
      - Access-Token: []
      description: Deletes simulation with given id
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulations
      summary: '# Delete Simulation'
      operationId: simulationDeleteParams
      parameters:
      - type: integer
        format: uint64
        description: Simulation ID (URI parameter)
        name: Id
        in: path
        required: true
      responses:
        '200':
          $ref: '#/responses/SimulationDeleteReturnSwagger'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorWithSuccessSwagger'
  /v1/simulations/{Id}/cancel:
    put:
      security:
      - Access-Token: []
      description: Cancels simulation with given id if it is running
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulations
      summary: '# Cancel Simulation'
      operationId: simulationCancelParams
      parameters:
      - type: integer
        format: uint64
        description: Simulation ID (URI parameter)
        name: Id
        in: path
        required: true
      responses:
        '200':
          $ref: '#/responses/SimulationCancelReturnSwagger'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorWithSuccessSwagger'
  /v1/simulations/{Id}/simulate-now:
    post:
      security:
      - Access-Token: []
      description: ReRuns simulation with given id
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulations
      summary: '# Simulate Now'
      operationId: simulateNowParams
      parameters:
      - type: integer
        format: uint64
        description: Simulation ID (URI parameter)
        name: Id
        in: path
        required: true
      responses:
        '200':
          $ref: '#/responses/SimulateNowReturnSwagger'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorSwagger'
responses:
  SimulateNowReturnSwagger:
    description: SimulateNowReturnSwagger
    schema:
      type: object
      properties:
        run_immediately:
          type: boolean
          x-go-name: RunImmediately
        run_info:
          $ref: '#/definitions/SimulationRunApiOutput'
        simulation:
          $ref: '#/definitions/SimulationApiOutput'
        simulation_already_exist:
          type: boolean
          x-go-name: AssessmentAlreadyExist
  SimulationCancelReturnSwagger:
    description: SimulationCancelReturnSwagger
    schema:
      type: object
      properties:
        success:
          type: boolean
          x-go-name: Success
  SimulationCreateReturnSwagger:
    description: SimulationCreateReturnSwagger
    schema:
      type: object
      properties:
        run_immediately:
          type: boolean
          x-go-name: RunImmediately
        run_info:
          $ref: '#/definitions/SimulationRunApiOutput'
        simulation:
          $ref: '#/definitions/SimulationApiOutput'
        simulation_already_exist:
          type: boolean
          x-go-name: AssessmentAlreadyExist
  SimulationDeleteReturnSwagger:
    description: SimulationDeleteReturnSwagger
    schema:
      type: object
      properties:
        success:
          type: boolean
          x-go-name: Success
  SimulationDetailReturnSwagger:
    description: SimulationDetailReturnSwagger
    schema:
      type: object
      properties:
        Simulations:
          $ref: '#/definitions/SimulationDetailsReturn'
  SimulationUpdateReturnSwagger:
    description: SimulationUpdateReturnSwagger
    schema:
      type: object
      properties:
        run_immediately:
          type: boolean
          x-go-name: RunImmediately
        simulation:
          $ref: '#/definitions/SimulationApiOutput'
  SimulationsResponse:
    description: SimulationsResponse
    schema:
      type: object
      properties:
        pages:
          $ref: '#/definitions/Pagination'
        simulations:
          type: array
          items:
            $ref: '#/definitions/SimulationSummary'
          x-go-name: Simulations
  genericErrorSwagger:
    description: genericErrorSwagger is represents the erroneous cases
    schema:
      type: object
      properties:
        error_code:
          description: Error Code is optional. It is using for define specific error types.
          type: integer
          format: int64
          x-go-name: ErrorCode
          example: 1001
        errors:
          description: Errors are optional. If there are multiple error, this field gives details.
          type: object
          additionalProperties:
            type: string
          x-go-name: Errors
          example: '["error1", "error2"]'
        message:
          description: Error Message that contains information about error
          type: string
          x-go-name: Message
  genericErrorWithSuccessSwagger:
    description: genericErrorWithSuccessSwagger is represents the erroneous cases with success field
    schema:
      type: object
      properties:
        error_code:
          description: Error Code is optional. It is using for define specific error types.
          type: integer
          format: int64
          x-go-name: ErrorCode
          example: 1001
        errors:
          description: Errors are optional. If there are multiple error, this field gives details.
          type: object
          additionalProperties:
            type: string
          x-go-name: Errors
          example: '["error1", "error2"]'
        message:
          description: Error Message that contains information about error
          type: string
          x-go-name: Message
        success:
          description: Success is used for specific responses.
          type: boolean
          x-go-name: Success
          example: false
  validationErrorSwagger:
    description: validationErrorSwagger is represents the erroneous cases
    schema:
      type: object
      properties:
        errors:
          description: Validation Error List
          type: object
          additionalProperties:
            type: string
          x-go-name: Errors
          example:
            param: tag=max, param=25, given value=1000
        message:
          description: Message will be "validation error"
          type: string
          x-go-name: Message
          example: validation error
definitions:
  AgentSummary:
    type: object
    properties:
      id:
        description: Agent Id
        type: integer
        format: uint64
        x-go-name: Id
        example: 1
      name:
        description: Agent Name
        type: string
        x-go-name: Name
        example: Agent-1
      status:
        description: Agent status gives information about your agent alive (alive | dead | expired)
        type: string
        x-go-name: Status
        example: alive | dead | expired
      type:
        description: Agent type (QuickEmail | Browser | Installable Agent | Windows | Linux | MacOS)
        type: string
        x-go-name: Type
        example: QuickEmail | Browser | Installable Agent | Windows | Linux | MacOS
      version:
        description: Agent Version like 3.4.0.0
        type: string
        x-go-name: Version
        example: 3.4.0.0
    x-go-package: github.com/picusnext/picus-digital/go/customer-api/simulations
  AssessmentProtocol:
    type: object
    properties:
      module_id:
        type: integer
        format: uint64
        x-go-name: ModuleID
        example: 1
      protocols:
        type: array
        items:
          type: string
        x-go-name: Protocols
        example:
        - http
        - https
    x-go-package: github.com/picusnext/picus-digital/go/customer-api/internal_request/internal_service_dto
  Detection:
    type: object
    properties:
      integrations:
        description: Integration List
        type: array
        items:
          $ref: '#/definitions/Enrichment'
        x-go-name: Enrichments
    x-go-package: github.com/picusnext/picus-digital/go/customer-api/simulations
  Enrichment:
    type: object
    properties:
      id:
        description: Integration Id
        type: integer
        format: int64
        x-go-name: Id
        example: 1
      product_name:
        description: Product Name
        type: string
        x-go-name: ProductName
        example: Crowdstrike
    x-go-package: github.com/picusnext/picus-digital/go/customer-api/simulations
  NullBool:
    type: object
    properties:
      Bool:
        type: boolean
      Valid:
        type: boolean
    x-go-package: github.com/picusnext/picus-ng-lib/go/kit/types
  NullInt64:
    type: object
    properties:
      Int64:
        type: integer
        format: int64
