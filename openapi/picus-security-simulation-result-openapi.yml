          format: int64
          x-go-name: CompletionRatio
        fail_reason_message:
          type: string
          x-go-name: FailReasonMessage
        results:
          $ref: '#/definitions/SimulationResultDTO'
        scheduled_time:
          type: integer
          format: int64
          x-go-name: ScheduledTime
        simulation_id:
          description: Simulation Id
          type: integer
          format: uint64
          x-go-name: SimulationId
        simulation_run_id:
          description: Simulation Run Id
          type: integer
          format: uint64
