swagger: '2.0'
info:
  title: Picus Customer API — Simulation-Result
  description: '<p class="body-1">You can access the simulation raw data using the Rest API. Scope of the API includes; Simulation
    list, Simulation Details, Threat/Objective/Action Results, Results mapped to MITRE ATTC&K and Unified Kill Chain frameworks,
    Detection Analysis Results, Validated Logs & Alerts with SIEM & EDR integration.</p>

    <p class="body-1">OAuth2 protocol is used to authorize Refresh/Access tokens. To obtain the API, you should generate a
    refresh token and then request an access token using the /v1/auth/token endpoint. The refresh token will be valid for
    6 months, whereas the access token will be available for 2 hours. After getting the access token, add Authorization: Bearer
    {accessToken} to the header to request access to the below endpoints.</p>

    <p class="body-1">Endpoints returning data with a lot of load works with the pagination method. You can use the offset
    and limit parameters to get the correct page.</p>


    <i class="body-1">Your usage will be limited with your Picus license.</i>'
  version: '1.0'
host: api.picussecurity.com
basePath: /
schemes:
- https
consumes:
- application/json
produces:
- application/json
securityDefinitions:
  Access-Token:
    description: After getting the access token, type <i>Bearer accessToken</i> to the Value input box to request access to
      the below endpoints For example <i>Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9</i>
    type: apiKey
    name: Authorization
    in: header
security:
- Access-Token: []
tags:
- name: Simulation-Result
paths:
  /v1/simulations/{Id}/run/{RunId}:
    get:
      security:
      - Access-Token: []
      description: 'Includes Prevention and Detection result details

        Prevention Result: Total Threats, Blocked/Not Blocked, Attackers Objective, UnAchieved/Achieved Count

        Detection Result: Logged/Not Logged, Alerted/Not Alerted Count'
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulation-Result
      summary: '# Simulation Run Result'
      operationId: simulationRunParams
      parameters:
      - type: integer
        format: uint64
        description: Simulation ID (URI parameter)
        name: Id
        in: path
        required: true
      - type: integer
        format: uint64
        description: Simulation Run ID (URI parameter)
        name: RunId
        in: path
        required: true
      responses:
        '200':
          $ref: '#/responses/SimulationRunDetailResponse'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorSwagger'
  /v1/simulations/{Id}/run/{RunId}/frameworks:
    get:
      security:
      - Access-Token: []
      description: Simulation Run Result with Mitre ATT&CK and Unified Kill Chain framework
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulation-Result
      summary: Simulation Run Result with Mitre ATT&CK and Unified Kill Chain framework
      operationId: runDetailParams
      parameters:
      - type: integer
        format: uint64
        description: Simulation ID (URI parameter)
        name: Id
        in: path
        required: true
      - type: integer
        format: uint64
        description: Simulation Run ID (URI parameter)
        name: RunId
        in: path
        required: true
      responses:
        '200':
          $ref: '#/responses/RunDetailResultsReturnSwagger'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorSwagger'
  /v1/simulations/{Id}/run/{RunId}/threats:
    get:
      security:
      - Access-Token: []
      description: 'Includes Threat, Attacker''s Objective, Action results for Prevention and Threat, Action results for Detection

        Default limit: 10, Default offset: 0

        Max limit: 50'
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulation-Result
      summary: '# Threats - Objectives - Actions'
      operationId: runThreatParams
      parameters:
      - type: integer
        format: int64
        x-go-name: Limit
        name: limit
        in: query
      - type: integer
        format: int64
        x-go-name: Offset
        name: offset
        in: query
      - type: integer
        format: uint64
        description: Simulation ID (URI parameter)
        name: Id
        in: path
        required: true
      - type: integer
        format: uint64
        description: Simulation Run ID (URI parameter)
        name: RunId
        in: path
        required: true
      responses:
        '200':
          $ref: '#/responses/ThreatResultsReturnSwagger'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorSwagger'
  /v1/simulations/{Id}/run/{RunId}/threats/{ThreatId}/actions:
    get:
      security:
      - Access-Token: []
      description: 'Includes detailed action result with attack start & end time, log & alert time and attack module based
        details (payloads, terminal log, file name, sha256, md5, sha1) for the actions of the given threat.

        Protocol based results are also available.'
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulation-Result
      summary: '# Action Details List'
      operationId: actionDetailsListParams
      parameters:
      - type: integer
        format: int64
        x-go-name: Limit
        name: limit
        in: query
      - type: integer
        format: int64
        x-go-name: Offset
        name: offset
        in: query
      - type: integer
        format: uint64
        description: Simulation ID (URI parameter)
        name: Id
        in: path
        required: true
      - type: integer
        format: uint64
        description: Simulation Run ID (URI parameter)
        name: RunId
        in: path
        required: true
      - type: integer
        format: uint64
        description: Threat ID (URI parameter)
        name: ThreatId
        in: path
        required: true
      - type: array
        items:
          type: integer
          format: uint64
        x-go-name: ActionIDs
        description: List Action Details With Action ID List. (Max 100 ids)
        name: action_ids
        in: query
      - type: array
        items:
          type: integer
          format: uint64
        x-go-name: ActionDisplayIDs
        description: List Action Details With Action Display ID List. (Max 100 display ids)
        name: action_display_ids
        in: query
      responses:
        '200':
          $ref: '#/responses/ActionDetailsListReturnSwagger'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorSwagger'
  /v1/simulations/{Id}/run/{RunId}/threats/{ThreatId}/actions/{ActionId}:
    get:
      security:
      - Access-Token: []
      description: 'Includes detailed action result with attack start & end time, log & alert time and attack module based
        details (payloads, terminal log, file name, sha256, md5, sha1).

        Protocol based results are also available.'
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulation-Result
      summary: '# Action Details'
      operationId: actionDetailsParams
      parameters:
      - type: integer
        format: uint64
        description: Simulation Run ID (URI parameter)
        name: RunId
        in: path
        required: true
      - type: integer
        format: uint64
        description: Action ID (URI parameter)
        name: ActionId
        in: path
        required: true
      - type: integer
        format: uint64
        description: Simulation ID (URI parameter)
        name: Id
        in: path
        required: true
      - type: integer
        format: uint64
        description: Threat ID (URI parameter)
        name: ThreatId
        in: path
        required: true
      - type: integer
        format: int64
        x-go-name: NodeId
        name: node_id
        in: query
      responses:
        '200':
          $ref: '#/responses/ActionDetailsReturnSwagger'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorSwagger'
  /v1/simulations/{Id}/run/{RunId}/threats/{ThreatId}/actions/{ActionId}/integrations/{IntegrationId}/alerts:
    get:
      security:
      - Access-Token: []
      description: 'Includes Action Name, Log Source and Alert Time.

        Default limit: 100, Default offset: 0

        Max limit: 1000

        Same action can be used multiple times under the scope of threat where these actions are distinguished by node_id

        node_id parameter can be used optionally. For the case it is not provided, first node is returned.'
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulation-Result
      summary: '# Integration based Alert Details for Actions'
      operationId: actionAlertsParams
      parameters:
      - type: integer
        format: int64
        x-go-name: Limit
        name: limit
        in: query
      - type: integer
        format: int64
        x-go-name: Offset
        name: offset
        in: query
      - type: integer
        format: uint64
        description: Simulation Run ID (URI parameter)
        name: RunId
        in: path
        required: true
      - type: integer
        format: uint64
        description: Simulation ID (URI parameter)
        name: Id
        in: path
        required: true
      - type: integer
        format: uint64
        description: Threat ID (URI parameter)
        name: ThreatId
        in: path
        required: true
      - type: integer
        format: uint64
        description: Action ID (URI parameter)
        name: ActionId
        in: path
        required: true
      - type: integer
        format: uint64
        description: Integration ID (URI parameter)
        name: IntegrationId
        in: path
        required: true
      - type: integer
        format: int64
        x-go-name: NodeId
        name: node_id
        in: query
      responses:
        '200':
          $ref: '#/responses/ActionAlertsReturnSwagger'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorSwagger'
  /v1/simulations/{Id}/run/{RunId}/threats/{ThreatId}/actions/{ActionId}/integrations/{IntegrationId}/logs:
    get:
      security:
      - Access-Token: []
      description: 'Includes Action Name, Log Source and Log Time.

        Default limit: 100, Default offset: 0

        Max limit: 1000

        Same action can be used multiple times under the scope of threat where these actions are distinguished by node_id

        node_id parameter can be used optionally. For the case it is not provided, first node is returned.'
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulation-Result
      summary: '# Integration based Log Details for Actions'
      operationId: actionLogsParams
      parameters:
      - type: integer
        format: int64
        x-go-name: Limit
        name: limit
        in: query
      - type: integer
        format: int64
        x-go-name: Offset
        name: offset
        in: query
      - type: integer
        format: uint64
        description: Simulation Run ID (URI parameter)
        name: RunId
        in: path
        required: true
      - type: integer
        format: uint64
        description: Simulation ID (URI parameter)
        name: Id
        in: path
        required: true
      - type: integer
        format: uint64
        description: Threat ID (URI parameter)
        name: ThreatId
        in: path
        required: true
      - type: integer
        format: uint64
        description: Action ID (URI parameter)
        name: ActionId
        in: path
        required: true
      - type: integer
        format: uint64
        description: Integration ID (URI parameter)
        name: IntegrationId
        in: path
        required: true
      - type: integer
        format: int64
        x-go-name: NodeId
        name: node_id
        in: query
      responses:
        '200':
          $ref: '#/responses/ActionLogsReturnSwagger'
        '422':
          $ref: '#/responses/validationErrorSwagger'
        default:
          $ref: '#/responses/genericErrorSwagger'
  /v1/simulations/{SimulationId}/run/{RunId}/threats/{ThreatId}/peers/{PeerId}/integrations/{IntegrationId}/raw-logs:
    get:
      security:
      - Access-Token: []
      description: 'Retrieves raw log file download links for a specific threat, peer, and integration combination.

        Returns an array of URLs pointing to raw log files that can be downloaded.'
      consumes:
      - application/json
      produces:
      - application/json
      schemes:
      - https
      tags:
      - Simulation-Result
      summary: '# Raw Log File Links'
      operationId: rawLogsParams
      parameters:
      - type: integer
        format: uint64
        description: Simulation ID (URI parameter)
        name: SimulationId
        in: path
        required: true
      - type: integer
        format: uint64
        description: Run ID (URI parameter)
        name: RunId
        in: path
        required: true
      - type: integer
        format: uint64
        description: Threat ID (URI parameter)
        name: ThreatId
        in: path
        required: true
      - type: integer
        format: uint64
        description: Peer ID (URI parameter)
        name: PeerId
        in: path
        required: true
      - type: integer
        format: uint64
