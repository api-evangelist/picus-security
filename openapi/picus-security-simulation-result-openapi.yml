  SimulationRunDetailResponse:
    description: SimulationRunDetailResponse
    schema:
      type: object
      properties:
        completed_at:
          description: Completed At (if completed)
          type: integer
          format: int64
          x-go-name: CompletedAt
        completion_ratio:
