aid: picus-security
name: Picus Security
description: >-
  Picus Security is a cybersecurity company that pioneered Breach and Attack Simulation (BAS) in 2013 and now
  ships the Picus Security Validation Platform for Adversarial Exposure Validation (AEV) and Continuous Threat
  Exposure Management (CTEM). The platform continuously simulates real-world adversary techniques against
  network, endpoint, email and cloud controls, scores prevention and detection effectiveness, maps results to
  MITRE ATT&CK and the Unified Kill Chain, and returns vendor-specific mitigation signatures and validated
  detection rules from the Picus Mitigation Library. The Picus Customer API is a public REST API documented at
  apidocs.picussecurity.com and served from api.picussecurity.com, exposing simulations, simulation run
  results, the threat library, threat templates, agents, integrations, mitigation and detection content,
  exposure instance scores, users and roles, and activity logs, authorized with OAuth2-issued refresh and
  access tokens.
