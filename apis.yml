apis:
- name: Picus Customer API
  description: >-
    Public REST API for the Picus Security Validation Platform. Create, run, update, cancel and delete
    simulations; read simulation run results including threats, attacker objectives and per-action detail with
    MITRE ATT&CK and Unified Kill Chain mappings; pull SIEM/EDR-integration log and alert evidence; browse and
    author the threat library (threats, actions, processes, files, tags, threat actors, import/export threat
    packs); manage threat templates, agents, integrations, mitigation devices and signatures, custom detection
    content, exposure instance scores, users and roles, and activity logs. Authorization uses an OAuth2 refresh
    token (6 months) exchanged at /v1/auth/token for a bearer access token (2 hours).
  humanURL: https://apidocs.picussecurity.com/
  baseURL: https://api.picussecurity.com/
