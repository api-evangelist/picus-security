notes:
- >-
  The core spine is Template -> Simulation -> SimulationRun -> SimulationRunThreat -> Action, with every run
  result carrying dual scoring (prevention: blocked/not-blocked; detection: logged/alerted) and dual framework
  mapping (MITRE ATT&CK + Unified Kill Chain).
- >-
  The contract exposes Go implementation types (NullInt64, NullBool, x-go-name on nearly every property),
  which is a design leak worth flagging to the provider — it constrains future re-implementation.
- >-
  No Asset entity is returnable: exposure instance scores accept asset_id/cve_id pairs as INPUT only
  (POST /v1/exposures/instances/scores) and omit unmatched pairs from the response.
