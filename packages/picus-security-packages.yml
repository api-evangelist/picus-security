summary: >-
  Picus Security publishes NO first-party client libraries. There is no Picus GitHub organization, no npm
  scope, no PyPI distribution, no CLI, and no SDK page anywhere in the API documentation. The only
  integration code shipped for the Picus Customer API is third-party: the Cortex XSOAR content packs
  ("Picus Security" and "Picus Security NG") maintained by Palo Alto Networks in demisto/content, and a
  Datadog integration built by Crest Data Systems. Integrators call the REST API directly with curl or a
  generic HTTP client — the documentation's recipes are all raw curl.
